[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible-skills"
version = "0.1.0.dev0"
description = "Verification engineering for AI agent methodologies"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
crucible = "crucible.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
