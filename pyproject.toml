[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
version = "0.1.0.dev0"
description = "Verification engineering for AI agent methodologies"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
crucible = "crucible.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]
api = ["fastapi>=0.100", "uvicorn>=0.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
